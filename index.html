<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>🌸 Everything Rahel 🌸</title>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,300;0,400;0,600;0,700;1,300&family=Chewy&family=Nunito:wght@600;700;800;900&display=swap" rel="stylesheet">
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }

  :root {
    --sky: #a8dff0;
    --sky2: #d4f0fc;
    --grass: #7dc95e;
    --grass2: #5aab3a;
    --yellow: #f9e04b;
    --red: #e8453c;
    --black: #1a1a1a;
    --cream: #fdf6e3;
    --pink: #f7b8c4;
    --lavender: #c9b8f5;
    --peach: #ffc89a;
    --mint: #a8e6cf;
  }

  body {
    min-height: 100vh;
    font-family: 'Nunito', sans-serif;
    overflow-x: hidden;
    display: flex;
    flex-direction: column;
    align-items: center;
    position: relative;
  }

  /* Sky gradient background */
  body::before {
    content: '';
    position: fixed;
    inset: 0;
    background: linear-gradient(180deg,
      #b8e8f8 0%,
      #d9f2fc 55%,
      #c5e8a0 55%,
      #7dc95e 100%
    );
    z-index: -3;
  }

  /* Clouds */
  .cloud {
    position: fixed;
    background: white;
    border-radius: 50px;
    opacity: 0.88;
    z-index: -1;
    pointer-events: none;
    animation: drift linear infinite;
  }
  .cloud::before, .cloud::after {
    content: '';
    position: absolute;
    background: white;
    border-radius: 50%;
  }
  .cloud::before { width: 60%; height: 130%; top: -40%; left: 15%; }
  .cloud::after  { width: 45%; height: 110%; top: -30%; right: 10%; }
  @keyframes drift {
    from { transform: translateX(-220px); }
    to   { transform: translateX(110vw); }
  }

  /* Sun */
  .sun {
    position: fixed;
    top: 30px; right: 60px;
    width: 70px; height: 70px;
    background: var(--yellow);
    border-radius: 50%;
    box-shadow: 0 0 0 10px rgba(249,224,75,0.3), 0 0 0 22px rgba(249,224,75,0.15);
    z-index: -1;
    pointer-events: none;
    animation: sunPulse 4s ease-in-out infinite alternate;
  }
  @keyframes sunPulse {
    from { box-shadow: 0 0 0 10px rgba(249,224,75,0.3), 0 0 0 22px rgba(249,224,75,0.15); }
    to   { box-shadow: 0 0 0 16px rgba(249,224,75,0.35), 0 0 0 32px rgba(249,224,75,0.18); }
  }

  /* Grass hills at bottom */
  .hills {
    position: fixed;
    bottom: 0; left: 0; right: 0;
    height: 140px;
    z-index: -1;
    pointer-events: none;
    overflow: hidden;
  }
  .hill {
    position: absolute;
    bottom: 0;
    border-radius: 50% 50% 0 0;
  }
  .h1 { left: -8%;  width: 60%; height: 110px; background: #5aab3a; }
  .h2 { left: 15%;  width: 50%; height: 85px;  background: #6bbf48; }
  .h3 { right: -8%; width: 60%; height: 120px; background: #4e9e32; }
  .h4 { right: 15%; width: 45%; height: 75px;  background: #72c752; }

  /* Snoopy SVG doghouse */
  .doghouse {
    position: fixed;
    bottom: 70px;
    left: 30px;
    width: 100px;
    z-index: 0;
    pointer-events: none;
    filter: drop-shadow(2px 4px 6px rgba(0,0,0,0.2));
  }

  /* Floating flowers */
  .flower {
    position: fixed;
    font-size: 1.4rem;
    pointer-events: none;
    z-index: 0;
    animation: sway 5s ease-in-out infinite alternate;
    opacity: 0.8;
  }
  @keyframes sway {
    0%   { transform: rotate(-8deg) translateY(0); }
    100% { transform: rotate(8deg) translateY(-10px); }
  }

  /* Floating petals */
  .petal {
    position: fixed;
    font-size: 1rem;
    pointer-events: none;
    z-index: 0;
    animation: petalFall linear infinite;
    opacity: 0;
  }
  @keyframes petalFall {
    0%   { transform: translateY(-20px) rotate(0deg) translateX(0); opacity: 0.8; }
    100% { transform: translateY(100vh) rotate(540deg) translateX(40px); opacity: 0; }
  }

  /* Header */
  header {
    text-align: center;
    padding: 1.6rem 1rem 0.5rem;
    position: relative;
    z-index: 1;
  }

  /* Snoopy on top of doghouse (inline SVG-style text art) */
  .snoopy-header {
    font-size: 3.5rem;
    line-height: 1;
    margin-bottom: 0.2rem;
    animation: snoopyBounce 3s ease-in-out infinite;
    display: inline-block;
  }
  @keyframes snoopyBounce {
    0%, 100% { transform: translateY(0) rotate(-2deg); }
    50%       { transform: translateY(-8px) rotate(2deg); }
  }

  .title {
    font-family: 'Cormorant Garamond', serif;
    font-size: clamp(2.4rem, 6vw, 4.2rem);
    color: var(--black);
    letter-spacing: 3px;
    line-height: 1;
    font-weight: 600;
    text-shadow: 1px 2px 8px rgba(0,0,0,0.12);
  }

  .title span { color: var(--red); }

  .subtitle {
    font-size: 0.9rem;
    color: #555;
    margin-top: 0.4rem;
    font-weight: 700;
    letter-spacing: 1.5px;
    text-transform: uppercase;
    background: rgba(255,255,255,0.55);
    display: inline-block;
    padding: 3px 14px;
    border-radius: 99px;
    border: 2px solid rgba(0,0,0,0.08);
  }

  /* Progress */
  .progress-area {
    margin: 0.7rem auto;
    text-align: center;
    z-index: 1;
    position: relative;
  }
  .progress-text {
    color: #444;
    font-size: 0.82rem;
    font-weight: 800;
    letter-spacing: 1px;
    text-transform: uppercase;
    background: rgba(255,255,255,0.6);
    padding: 2px 12px;
    border-radius: 99px;
    display: inline-block;
  }
  .progress-bar-wrap {
    width: 200px;
    height: 10px;
    background: rgba(0,0,0,0.1);
    border-radius: 99px;
    margin: 0.4rem auto 0;
    overflow: hidden;
    border: 2px solid rgba(0,0,0,0.1);
  }
  .progress-bar-fill {
    height: 100%;
    background: linear-gradient(90deg, #f7b8c4, #e8453c);
    border-radius: 99px;
    transition: width 0.6s cubic-bezier(.34,1.56,.64,1);
    width: 0%;
  }

  /* Calendar grid */
  .calendar {
    display: grid;
    grid-template-columns: repeat(5, 1fr);
    grid-auto-rows: 115px;
    gap: 12px;
    max-width: 880px;
    width: 100%;
    padding: 1rem 1.2rem 180px;
    position: relative;
    z-index: 1;
  }

  /* Boxes */
  .box {
    border-radius: 22px;
    cursor: pointer;
    position: relative;
    transition: transform 0.2s cubic-bezier(.34,1.56,.64,1);
    user-select: none;
    /* Comic book border */
    outline: 3px solid var(--black);
    outline-offset: -1px;
  }
  .box:hover { transform: scale(1.07) translateY(-4px) rotate(-1deg); z-index: 2; }
  .box:active { transform: scale(0.95); }

  .box.tall { grid-row: span 2; }
  .box.wide { grid-column: span 2; }

  .box-inner {
    width: 100%;
    height: 100%;
    border-radius: 20px;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 4px;
    position: relative;
    overflow: hidden;
    transition: opacity 0.3s, filter 0.3s;
  }

  /* Halftone dot pattern on boxes */
  .box-inner::before {
    content: '';
    position: absolute;
    inset: 0;
    background-image: radial-gradient(circle, rgba(0,0,0,0.06) 1px, transparent 1px);
    background-size: 8px 8px;
    pointer-events: none;
    border-radius: 20px;
  }

  /* Gloss */
  .box-inner::after {
    content: '';
    position: absolute;
    top: 0; left: 0; right: 0;
    height: 44%;
    background: linear-gradient(180deg, rgba(255,255,255,0.28) 0%, transparent 100%);
    border-radius: 20px 20px 0 0;
    pointer-events: none;
  }

  /* Pastel spring colours */
  .box.pink   .box-inner { background: linear-gradient(145deg, #f9cdd8, #f0a8b8); box-shadow: 0 6px 20px rgba(240,168,184,0.5); }
  .box.yellow .box-inner { background: linear-gradient(145deg, #fdf09a, #f5d83a); box-shadow: 0 6px 20px rgba(245,216,58,0.5); }
  .box.mint   .box-inner { background: linear-gradient(145deg, #b8ecd4, #7fd6a8); box-shadow: 0 6px 20px rgba(127,214,168,0.5); }
  .box.lavender .box-inner { background: linear-gradient(145deg, #d8ccf8, #b8a4f0); box-shadow: 0 6px 20px rgba(184,164,240,0.5); }
  .box.sky    .box-inner { background: linear-gradient(145deg, #b8e6f8, #7ec8e8); box-shadow: 0 6px 20px rgba(126,200,232,0.5); }
  .box.peach  .box-inner { background: linear-gradient(145deg, #ffd8b0, #ffb878); box-shadow: 0 6px 20px rgba(255,184,120,0.5); }

  .box-number {
    font-family: 'Cormorant Garamond', serif;
    font-size: 2.6rem;
    font-weight: 600;
    line-height: 1;
    color: var(--black);
    z-index: 1;
    letter-spacing: 1px;
  }

  .box-icon { display: none; }

  /* Opened */
  .box.opened .box-inner { opacity: 0.45; filter: saturate(0.25) brightness(1.05); }
  .box.opened .check {
    position: absolute;
    top: 7px; right: 9px;
    width: 22px; height: 22px;
    background: var(--black);
    border-radius: 50%;
    font-size: 0.65rem;
    display: flex;
    align-items: center;
    justify-content: center;
    color: white;
    font-weight: 900;
    z-index: 3;
  }

  @keyframes pop {
    0%   { transform: scale(1); }
    35%  { transform: scale(1.18) rotate(-3deg); }
    65%  { transform: scale(0.93) rotate(2deg); }
    100% { transform: scale(1); }
  }
  .box.just-opened { animation: pop 0.5s cubic-bezier(.34,1.56,.64,1); }

  /* Modal */
  .modal-overlay {
    display: none;
    position: fixed;
    inset: 0;
    background: rgba(168,223,240,0.5);
    backdrop-filter: blur(10px);
    z-index: 200;
    align-items: center;
    justify-content: center;
    padding: 1rem;
  }
  .modal-overlay.active { display: flex; }

  .modal {
    background: var(--cream);
    border-radius: 28px;
    width: 100%;
    max-width: 660px;
    padding: 1.5rem;
    position: relative;
    box-shadow: 0 30px 80px rgba(0,0,0,0.25);
    animation: modalIn 0.38s cubic-bezier(.34,1.56,.64,1);
    border: 3px solid var(--black);
    outline: 6px solid var(--pink);
    outline-offset: -6px;
  }
  @keyframes modalIn {
    from { transform: scale(0.6) translateY(40px); opacity: 0; }
    to   { transform: scale(1); opacity: 1; }
  }

  .modal-header {
    display: flex;
    align-items: center;
    justify-content: space-between;
    margin-bottom: 1rem;
  }
  .modal-title {
    font-family: 'Cormorant Garamond', serif;
    font-size: 2rem;
    color: var(--black);
    letter-spacing: 1px;
    font-weight: 600;
  }
  .close-btn {
    background: var(--red);
    border: 2px solid var(--black);
    border-radius: 50%;
    width: 38px; height: 38px;
    font-size: 1rem;
    cursor: pointer;
    display: flex;
    align-items: center;
    justify-content: center;
    color: white;
    font-weight: 900;
    transition: background 0.15s, transform 0.2s;
    flex-shrink: 0;
    box-shadow: 2px 2px 0 var(--black);
  }
  .close-btn:hover { background: #c0392b; transform: scale(1.12) rotate(90deg); }

  .video-wrapper {
    position: relative;
    padding-bottom: 56.25%;
    border-radius: 16px;
    overflow: hidden;
    background: #111;
    border: 3px solid var(--black);
  }
  .video-wrapper iframe,
  .video-wrapper video {
    position: absolute;
    inset: 0;
    width: 100%;
    height: 100%;
    border: none;
  }
  .video-placeholder {
    position: absolute;
    inset: 0;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    background: linear-gradient(135deg, #a8dff0, #d4f0fc);
    color: #1a1a1a;
    text-align: center;
    padding: 2rem;
    gap: 0.7rem;
  }
  .video-placeholder .ph-icon { font-size: 3.5rem; }
  .video-placeholder strong { font-size: 1.05rem; font-family: 'Chewy', cursive; font-size: 1.3rem; }
  .video-placeholder p { font-size: 0.83rem; opacity: 0.75; line-height: 1.55; color: #333; }
  .video-placeholder code {
    background: rgba(0,0,0,0.1);
    padding: 3px 9px;
    border-radius: 7px;
    font-size: 0.76rem;
  }

  .modal-footer {
    text-align: center;
    margin-top: 0.9rem;
    font-size: 0.85rem;
    color: #555;
    font-weight: 800;
    font-family: 'Chewy', cursive;
    font-size: 1.1rem;
    letter-spacing: 0.3px;
  }

  @media (max-width: 580px) {
    .calendar {
      grid-template-columns: repeat(3, 1fr);
      grid-auto-rows: 100px;
      gap: 8px;
      padding: 0.6rem 0.8rem 140px;
    }
    .doghouse { display: none; }
  }
</style>
</head>
<body>

<!-- Sun -->
<div class="sun"></div>

<!-- Clouds -->
<div class="cloud" style="top:6%;left:-180px;width:160px;height:50px;animation-duration:28s;animation-delay:0s;"></div>
<div class="cloud" style="top:12%;left:-180px;width:120px;height:38px;animation-duration:38s;animation-delay:10s;"></div>
<div class="cloud" style="top:4%;left:-180px;width:200px;height:60px;animation-duration:45s;animation-delay:20s;"></div>
<div class="cloud" style="top:18%;left:-180px;width:140px;height:44px;animation-duration:32s;animation-delay:5s;"></div>

<!-- Hills -->
<div class="hills">
  <div class="hill h1"></div>
  <div class="hill h2"></div>
  <div class="hill h3"></div>
  <div class="hill h4"></div>
</div>

<!-- Snoopy Doghouse SVG in corner -->
<svg class="doghouse" viewBox="0 0 100 90" xmlns="http://www.w3.org/2000/svg">
  <!-- House body -->
  <rect x="10" y="40" width="80" height="50" rx="4" fill="#c8a46e" stroke="#1a1a1a" stroke-width="3"/>
  <!-- Roof -->
  <polygon points="5,42 50,8 95,42" fill="#e8453c" stroke="#1a1a1a" stroke-width="3"/>
  <!-- Door -->
  <rect x="35" y="60" width="30" height="30" rx="3" fill="#1a1a1a"/>
  <!-- Roof ridge -->
  <line x1="5" y1="42" x2="95" y2="42" stroke="#1a1a1a" stroke-width="2"/>
  <!-- "SNOOPY" text -->
  <text x="50" y="56" text-anchor="middle" font-family="Chewy, cursive" font-size="11" fill="#1a1a1a">SNOOPY</text>
  <!-- Snoopy lying on roof -->
  <!-- Body -->
  <ellipse cx="50" cy="28" rx="22" ry="9" fill="white" stroke="#1a1a1a" stroke-width="2"/>
  <!-- Head -->
  <circle cx="72" cy="22" r="9" fill="white" stroke="#1a1a1a" stroke-width="2"/>
  <!-- Ear -->
  <ellipse cx="67" cy="28" rx="5" ry="8" fill="#1a1a1a" stroke="#1a1a1a" stroke-width="1"/>
  <!-- Eye -->
  <circle cx="75" cy="20" r="1.5" fill="#1a1a1a"/>
  <!-- Nose -->
  <ellipse cx="80" cy="23" rx="3" ry="2" fill="#1a1a1a"/>
  <!-- Smile -->
  <path d="M76,26 Q79,29 82,26" stroke="#1a1a1a" stroke-width="1.5" fill="none"/>
  <!-- Tail -->
  <path d="M28,26 Q18,18 22,10" stroke="#1a1a1a" stroke-width="2.5" fill="none" stroke-linecap="round"/>
</svg>

<!-- Decorative flowers -->
<div class="flower" style="bottom:100px;right:40px;animation-delay:0s">🌸</div>
<div class="flower" style="bottom:90px;right:90px;animation-delay:1s;font-size:1rem">🌼</div>
<div class="flower" style="bottom:105px;right:140px;animation-delay:2s;font-size:1.2rem">🌷</div>
<div class="flower" style="bottom:90px;left:140px;animation-delay:0.5s">🌸</div>
<div class="flower" style="bottom:100px;left:200px;animation-delay:1.5s;font-size:1rem">🌻</div>

<!-- Falling petals -->
<div id="petals"></div>

<header>
  <div class="snoopy-header">🌸</div>
  <div class="title">Everything Rahel</div>
  <div class="subtitle">✨ 21 little surprises, just for you ✨</div>
</header>

<div class="progress-area">
  <div class="progress-text" id="progressText">0 of 21 opened</div>
  <div class="progress-bar-wrap">
    <div class="progress-bar-fill" id="progressBar"></div>
  </div>
</div>

<div class="calendar" id="calendar"></div>

<!-- Modal -->
<div class="modal-overlay" id="modalOverlay">
  <div class="modal">
    <div class="modal-header">
      <div class="modal-title" id="modalTitle">🌸 Box #1</div>
      <button class="close-btn" onclick="closeModal()">✕</button>
    </div>
    <div class="video-wrapper" id="videoWrapper"></div>
    <div class="modal-footer">A little gift for you!</div>
  </div>
</div>

<script>
  // ============================================================
  //  ADD YOUR VIDEO URLS HERE
  //  YouTube:  "https://www.youtube.com/watch?v=VIDEO_ID"
  //  Vimeo:    "https://vimeo.com/VIDEO_ID"
  //  Direct:   "https://example.com/video.mp4"
  // ============================================================
  const videos = [
    "", // Box 1
    "", // Box 2
    "", // Box 3
    "", // Box 4
    "", // Box 5
    "", // Box 6
    "", // Box 7
    "", // Box 8
    "", // Box 9
    "", // Box 10
    "", // Box 11
    "", // Box 12
    "", // Box 13
    "", // Box 14
    "", // Box 15
    "", // Box 16
    "", // Box 17
    "", // Box 18
    "", // Box 19
    "", // Box 20
    "", // Box 21
  ];

  // Spring + Snoopy icons
  const icons = [
    '🌸','🐾','🦋','🌼','🌈',
    '🐦','🌻','☁️','🌷','🍀',
    '🐝','⭐','🌿','🐕','🎀',
    '🌺','🍃','☀️','🌱','🎈','💛'
  ];

  // Spring pastel colours
  const colors = [
    'pink','yellow','mint','lavender','sky',
    'peach','pink','mint','yellow','lavender',
    'sky','pink','peach','yellow','mint',
    'lavender','pink','sky','peach','mint','yellow'
  ];

  const layout = {
    3:  'tall',
    8:  'wide',
    14: 'wide',
    18: 'wide',
  };

  const openedSet = new Set(JSON.parse(localStorage.getItem('spring-advent-v1') || '[]'));

  function saveOpened() {
    localStorage.setItem('spring-advent-v1', JSON.stringify([...openedSet]));
  }

  function updateProgress() {
    const n = openedSet.size;
    document.getElementById('progressText').textContent = `${n} of 21 opened`;
    document.getElementById('progressBar').style.width = `${(n/21)*100}%`;
  }

  const cal = document.getElementById('calendar');

  for (let i = 1; i <= 21; i++) {
    const box = document.createElement('div');
    const color = colors[i-1] || 'pink';
    const size = layout[i] || '';
    const isOpened = openedSet.has(i);

    box.className = `box ${color} ${size} ${isOpened ? 'opened' : ''}`;
    box.innerHTML = `
      <div class="box-inner">
        <span class="box-number">${i}</span>
      </div>
      ${isOpened ? '<div class="check">✓</div>' : ''}
    `;
    box.addEventListener('click', () => openBox(i, box));
    cal.appendChild(box);
  }

  updateProgress();

  function openBox(num, boxEl) {
    const wasOpened = openedSet.has(num);
    openedSet.add(num);
    saveOpened();

    if (!wasOpened) {
      boxEl.classList.add('opened');
      const check = document.createElement('div');
      check.className = 'check';
      check.textContent = '✓';
      boxEl.appendChild(check);
      updateProgress();
    }

    boxEl.classList.add('just-opened');
    setTimeout(() => boxEl.classList.remove('just-opened'), 600);

    spawnPetals();

    document.getElementById('modalTitle').textContent = `Box ${num}`;
    const wrapper = document.getElementById('videoWrapper');
    wrapper.innerHTML = '';

    const url = videos[num - 1];
    if (!url) {
      wrapper.innerHTML = `
        <div class="video-placeholder">
          <div class="ph-icon">🌸</div>
          <strong>Box ${num} — Add Your Video</strong>
          <p>Open the HTML file in a text editor and paste the video URL into the <code>videos</code> array at position ${num}.</p>
        </div>`;
    } else {
      wrapper.innerHTML = getEmbedHTML(url);
    }

    document.getElementById('modalOverlay').classList.add('active');
  }

  function getEmbedHTML(url) {
    const yt = url.match(/(?:youtube\.com\/watch\?v=|youtu\.be\/)([^&\s]+)/);
    if (yt) return `<iframe src="https://www.youtube.com/embed/${yt[1]}?autoplay=1" allow="autoplay; encrypted-media" allowfullscreen></iframe>`;
    const vm = url.match(/vimeo\.com\/(\d+)/);
    if (vm) return `<iframe src="https://player.vimeo.com/video/${vm[1]}?autoplay=1" allow="autoplay; fullscreen" allowfullscreen></iframe>`;
    if (/\.(mp4|webm|ogg)/i.test(url)) return `<video controls autoplay src="${url}"></video>`;
    return `<iframe src="${url}" allowfullscreen></iframe>`;
  }

  function closeModal() {
    document.getElementById('modalOverlay').classList.remove('active');
    document.getElementById('videoWrapper').innerHTML = '';
  }

  document.getElementById('modalOverlay').addEventListener('click', e => {
    if (e.target.id === 'modalOverlay') closeModal();
  });
  document.addEventListener('keydown', e => { if (e.key === 'Escape') closeModal(); });

  // Floating petals background
  const petalEmojis = ['🌸','🌼','🌷','🍀','🌺'];
  const petalsEl = document.getElementById('petals');
  for (let i = 0; i < 12; i++) {
    const p = document.createElement('div');
    p.className = 'petal';
    p.textContent = petalEmojis[Math.floor(Math.random() * petalEmojis.length)];
    p.style.cssText = `left:${Math.random()*100}%;font-size:${0.7+Math.random()*1}rem;animation-duration:${8+Math.random()*10}s;animation-delay:${Math.random()*12}s`;
    document.body.appendChild(p);
  }

  // Confetti burst with spring colours + petals
  function spawnPetals() {
    const items = ['🌸','🌼','🌷','💛','🍀','🎀','⭐','🌈'];
    for (let i = 0; i < 20; i++) {
      const el = document.createElement('div');
      const angle = Math.random() * 360;
      const dist = 70 + Math.random() * 140;
      el.textContent = items[Math.floor(Math.random() * items.length)];
      el.style.cssText = `
        position:fixed;
        font-size:${1+Math.random()*1.2}rem;
        left:50%;top:50%;
        pointer-events:none;
        z-index:400;
        transition:transform 0.85s ease-out, opacity 0.85s ease-out;
        transform:translate(-50%,-50%);
        opacity:1;
        user-select:none;
      `;
      document.body.appendChild(el);
      requestAnimationFrame(() => requestAnimationFrame(() => {
        const rad = angle * Math.PI / 180;
        el.style.transform = `translate(calc(-50% + ${Math.cos(rad)*dist}px), calc(-50% + ${Math.sin(rad)*dist}px)) rotate(${Math.random()*360}deg) scale(0.3)`;
        el.style.opacity = '0';
      }));
      setTimeout(() => el.remove(), 1000);
    }
  }
</script>
</body>
